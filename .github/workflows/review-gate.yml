name: Review Gate

on:
  push:
    paths:
      - '.github/reviews/**'
  pull_request:
    paths:
      - '.github/reviews/**'

jobs:
  review_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Evaluate Review Status
        run: |
          python -c "
          import glob, yaml, sys
          reviews = glob.glob('.github/reviews/*.yml')
          if not reviews:
              print('No review contracts found.')
              sys.exit(0)
          for r in reviews:
              with open(r) as f:
                  data = yaml.safe_load(f)
              review = data.get('review', {})
              status = review.get('status', 'pending').lower()
              if status != 'passed':
                  print(f'Review gate FAILED for {r}: status is {status}')
                  sys.exit(1)
          print('Review Gate Status Passed.')
          "
