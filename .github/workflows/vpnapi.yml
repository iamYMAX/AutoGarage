
name: VPNGate - Working US OpenVPN

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

jobs:
  vpngate:
    name: Download and test VPNGate servers
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # --------------------------------------------------
      # 1. INSTALL
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            openvpn \
            python3 \
            iproute2 \
            net-tools

      # --------------------------------------------------
      # 2. DOWNLOAD VPNGATE API
      # --------------------------------------------------

      - name: Download VPNGate API
        run: |

          set -e

          echo "Downloading VPNGate API..."

          curl \
            -L \
            --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "https://www.vpngate.net/api/iphone/" \
            -o vpngate.csv

          echo
          echo "VPNGate API downloaded:"
          wc -c vpngate.csv

          if [ ! -s vpngate.csv ]; then
            echo "ERROR: VPNGate returned empty file."
            exit 1
          fi

      # --------------------------------------------------
      # 3. PARSE VPNGATE
      # --------------------------------------------------

      - name: Select US servers
        run: |

          set -e

          mkdir -p candidates

          python3 <<'PY'

          import csv
          import base64
          import re
          from pathlib import Path

          source = Path("vpngate.csv")

          text = source.read_text(
              encoding="utf-8",
              errors="replace"
          )

          lines = text.splitlines()

          print("Searching VPNGate CSV header...")

          header_index = None

          for index, line in enumerate(lines):

              clean = line.strip()

              clean = clean.lstrip("#")

              if (
                  "HostName" in clean
                  and
                  "OpenVPN_ConfigData_Base64" in clean
              ):

                  header_index = index

                  break

          if header_index is None:

              print()
              print("ERROR: VPNGate CSV header not found.")
              print()

              for line in lines[:30]:
                  print(repr(line))

              raise SystemExit(1)

          print(
              f"CSV header found at line "
              f"{header_index + 1}"
          )

          csv_lines = lines[header_index:]

          csv_lines[0] = (
              csv_lines[0]
              .lstrip("#")
              .strip()
          )

          reader = csv.DictReader(csv_lines)

          print()
          print("CSV fields:")

          for field in reader.fieldnames or []:
              print(
                  f"  {field}"
              )

          rows = list(reader)

          required = [
              "HostName",
              "IP",
              "Score",
              "Ping",
              "CountryShort",
              "OpenVPN_ConfigData_Base64"
          ]

          missing = [
              field
              for field in required
              if field not in reader.fieldnames
          ]

          if missing:

              print()
              print(
                  "ERROR: Missing fields:"
              )

              for field in missing:
                  print(
                      f"  {field}"
                  )

              raise SystemExit(1)

          print()
          print(
              f"Total VPNGate servers: "
              f"{len(rows)}"
          )

          def safe_number(value):

              try:

                  value = str(value or "")

                  value = re.sub(
                      r"[^\d.]",
                      "",
                      value
                  )

                  if not value:
                      return 999999

                  return float(value)

              except Exception:

                  return 999999

          # ------------------------------------------------
          # US SERVERS
          # ------------------------------------------------

          us_servers = []

          for row in rows:

              country = (
                  row.get(
                      "CountryShort",
                      ""
                  )
                  .strip()
                  .upper()
              )

              config = (
                  row.get(
                      "OpenVPN_ConfigData_Base64",
                      ""
                  )
                  .strip()
              )

              if country != "US":
                  continue

              if not config:
                  continue

              us_servers.append(row)

          print()
          print(
              f"US servers with OpenVPN: "
              f"{len(us_servers)}"
          )

          if not us_servers:

              raise SystemExit(
                  "No US OpenVPN servers found."
              )

          # ------------------------------------------------
          # SORT
          # ------------------------------------------------

          us_servers.sort(
              key=lambda row: (
                  -int(
                      row.get(
                          "Score",
                          0
                      ) or 0
                  ),

                  safe_number(
                      row.get(
                          "Ping"
                      )
                  )
              )
          )

          # Проверяем до 20 кандидатов.
          candidates = us_servers[:20]

          print()
          print("Selected candidates:")
          print()

          # ------------------------------------------------
          # CREATE OVPN
          # ------------------------------------------------

          for number, row in enumerate(
              candidates,
              start=1
          ):

              hostname = (
                  row.get(
                      "HostName",
                      f"server-{number}"
                  )
                  .strip()
              )

              ip = (
                  row.get(
                      "IP",
                      ""
                  )
                  .strip()
              )

              score = (
                  row.get(
                      "Score",
                      ""
                  )
              )

              ping = (
                  row.get(
                      "Ping",
                      ""
                  )
              )

              encoded = (
                  row[
                      "OpenVPN_ConfigData_Base64"
                  ]
                  .strip()
              )

              safe_hostname = re.sub(
                  r"[^A-Za-z0-9_.-]+",
                  "_",
                  hostname
              )

              filename = (
                  f"candidate_{number:02d}_"
                  f"{safe_hostname}.ovpn"
              )

              try:

                  config = (
                      base64.b64decode(
                          encoded
                      )
                      .decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              except Exception as error:

                  print(
                      f"Decode error: "
                      f"{hostname}: "
                      f"{error}"
                  )

                  continue

              path = (
                  Path(
                      "candidates"
                  )
                  / filename
              )

              path.write_text(
                  config,
                  encoding="utf-8"
              )

              print(
                  f"{number:02d}. "
                  f"{hostname} | "
                  f"{ip} | "
                  f"Ping={ping} | "
                  f"Score={score}"
              )

          print()
          print("Generated configurations:")

          for path in sorted(
              Path(
                  "candidates"
              ).glob(
                  "*.ovpn"
              )
          ):

              print(
                  f"  {path}"
              )

      # --------------------------------------------------
      # 4. TEST OPENVPN
      # --------------------------------------------------

      - name: Test OpenVPN configurations
        id: openvpn
        run: |

          set +e

          mkdir -p working
          mkdir -p working/logs

          echo "Starting OpenVPN tests..."

          SUCCESS=0

          MAX_SUCCESS=5

          # VPNGate credentials.
          printf "vpn\nvpn\n" \
            > working/auth.txt

          chmod 600 \
            working/auth.txt

          for CONFIG in candidates/*.ovpn
          do

            if [ ! -f "$CONFIG" ]; then
              continue
            fi

            NAME=$(basename "$CONFIG")

            echo
            echo "======================================"
            echo "Testing $NAME"
            echo "======================================"

            LOG="working/logs/${NAME}.log"

            # Убиваем предыдущий OpenVPN.
            sudo pkill openvpn 2>/dev/null

            sleep 2

            # Запускаем OpenVPN.
            sudo timeout 90 \
              openvpn \
              --config "$CONFIG" \
              --auth-user-pass working/auth.txt \
              --daemon \
              --log "$LOG"

            CONNECTED=0

            for SECOND in $(seq 1 80)
            do

              if grep -q \
                "Initialization Sequence Completed" \
                "$LOG" \
                2>/dev/null
              then

                CONNECTED=1

                break

              fi

              if grep -qi \
                "AUTH_FAILED" \
                "$LOG" \
                2>/dev/null
              then

                break

              fi

              sleep 1

            done

            if [ "$CONNECTED" -eq 1 ]
            then

              echo
              echo "OPENVPN: SUCCESS"

              echo
              echo "Network interfaces:"

              ip addr show tun0 \
                2>/dev/null || true

              echo
              echo "VPN external IP:"

              EXTERNAL_IP=$(
                curl \
                  --interface tun0 \
                  --connect-timeout 10 \
                  --max-time 15 \
                  -4 \
                  https://api.ipify.org \
                  2>/dev/null
              )

              if [ -n "$EXTERNAL_IP" ]
              then

                echo "$EXTERNAL_IP"

                SUCCESS=$(
                  expr "$SUCCESS" + 1
                )

                cp \
                  "$CONFIG" \
                  "working/US_WORKING_${SUCCESS}.ovpn"

                echo
                echo "Saved as:"
                echo \
                  "US_WORKING_${SUCCESS}.ovpn"

              else

                echo \
                  "VPN connected but IP check failed."

              fi

            else

              echo
              echo "OPENVPN: FAILED"

            fi

            # Остановить VPN перед следующим сервером.
            sudo pkill openvpn 2>/dev/null

            sleep 3

            if [ "$SUCCESS" -ge "$MAX_SUCCESS" ]
            then

              echo
              echo \
                "Found $MAX_SUCCESS working servers."

              break

            fi

          done

          echo
          echo "======================================"
          echo "FINAL RESULT"
          echo "======================================"

          echo
          echo \
            "Working servers: $SUCCESS"

          if [ "$SUCCESS" -eq 0 ]
          then

            echo
            echo \
              "No working VPNGate servers found."

            echo
            echo "OpenVPN logs:"

            find \
              working/logs \
              -type f \
              -maxdepth 1 \
              -print

            exit 1

          fi

      # --------------------------------------------------
      # 5. CREATE CSV
      # --------------------------------------------------

      - name: Create CSV and ZIP
        run: |

          set -e

          python3 <<'PY'

          import csv
          import zipfile
          from pathlib import Path

          working = Path(
              "working"
          )

          configs = sorted(
              working.glob(
                  "US_WORKING_*.ovpn"
              )
          )

          if not configs:

              raise SystemExit(
                  "No working configs."
              )

          # ----------------------------------------------
          # CSV
          # ----------------------------------------------

          csv_file = (
              working
              / "vpngate_us_working.csv"
          )

          with csv_file.open(
              "w",
              newline="",
              encoding="utf-8-sig"
          ) as file:

              writer = csv.writer(
                  file
              )

              writer.writerow([
                  "config",
                  "service",
                  "username",
                  "password"
              ])

              for config in configs:

                  writer.writerow([
                      config.name,
                      "VPNGate",
                      "vpn",
                      "vpn"
                  ])

          # ----------------------------------------------
          # README
          # ----------------------------------------------

          readme = (
              working
              / "README.txt"
          )

          readme.write_text(
              """VPNGate working OpenVPN configs

These configurations successfully established
an OpenVPN connection during GitHub Actions testing.

VPNGate:

Username: vpn
Password: vpn

Kali Linux:

sudo apt update
sudo apt install openvpn -y

Connect:

sudo openvpn --config US_WORKING_1.ovpn

Check external IP:

curl -4 https://api.ipify.org

IMPORTANT:

VPNGate servers are public and can stop working
at any time.

The configs were tested during this workflow run.
""",
              encoding="utf-8"
          )

          # ----------------------------------------------
          # ZIP
          # ----------------------------------------------

          zip_file = Path(
              "vpngate_us_working.zip"
          )

          with zipfile.ZipFile(
              zip_file,
              "w",
              zipfile.ZIP_DEFLATED
          ) as archive:

              archive.write(
                  csv_file,
                  csv_file.name
              )

              archive.write(
                  readme,
                  readme.name
              )

              for config in configs:

                  archive.write(
                      config,
                      config.name
                  )

          print()
          print(
              f"Created: {zip_file}"
          )

          print()
          print("Contents:")

          with zipfile.ZipFile(
              zip_file
          ) as archive:

              for item in archive.namelist():

                  print(
                      f"  {item}"
                  )

          PY

      # --------------------------------------------------
      # 6. UPLOAD ARTIFACT
      # --------------------------------------------------

      - name: Upload working VPN configs
        uses: actions/upload-artifact@v4

        with:

          name: vpngate-us-working

          path: |
            vpngate_us_working.zip
            working/vpngate_us_working.csv
            working/README.txt
            working/US_WORKING_*.ovpn

          retention-days: 7

          if-no-files-found: error

      # --------------------------------------------------
      # 7. SHOW RESULT
      # --------------------------------------------------

      - name: Show final result
        run: |

          echo
          echo "======================================"
          echo "VPNGate workflow completed"
          echo "======================================"

          echo
          echo "Generated archive:"

          ls -lh \
            vpngate_us_working.zip

          echo
          echo "Working configurations:"

          ls -lh \
            working/US_WORKING_*.ovpn

