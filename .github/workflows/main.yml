name: ESP32 Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Build firmware
        run: pio run

      - name: Run tests
        run: pio test

      - name: Save firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: esp32-firmware
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/firmware.elf
            .pio/build/*/firmware.map
          if-no-files-found: warn
