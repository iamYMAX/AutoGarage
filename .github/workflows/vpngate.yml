
name: VPNGate - Find Working US OpenVPN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  test-vpngate:
    name: Find working VPNGate US servers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OpenVPN and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            openvpn \
            python3 \
            iproute2 \
            net-tools

      - name: Download VPNGate API
        run: |
          set -e

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "https://www.vpngate.net/api/iphone.aspx" \
            -o vpngate.csv

          echo "Downloaded VPNGate API:"
          wc -c vpngate.csv

          if [ ! -s vpngate.csv ]; then
            echo "VPNGate API returned empty response"
            exit 1
          fi

      - name: Select US servers
        run: |
          mkdir -p candidates

          python3 <<'PY'
          import csv
          import base64
          import re
          from pathlib import Path

          src = Path("vpngate.csv")

          lines = src.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines()

          lines = [
              x for x in lines
              if x.strip() and not x.startswith("*")
          ]

          if not lines:
              raise SystemExit(
                  "VPNGate API contains no usable CSV data"
              )

          reader = csv.DictReader(lines)
          rows = list(reader)

          required = [
              "CountryShort",
              "HostName",
              "IP",
              "Ping",
              "Score",
              "OpenVPN_ConfigData_Base64"
          ]

          missing = [
              x for x in required
              if x not in reader.fieldnames
          ]

          if missing:
              raise SystemExit(
                  f"Missing fields: {missing}"
              )

          def number(value, default=999999):
              try:
                  return float(
                      re.sub(
                          r"[^\d.]",
                          "",
                          str(value or "")
                      )
                  )
              except Exception:
                  return default

          # Берём только США с OpenVPN-конфигурацией.
          servers = [
              row for row in rows
              if row.get("CountryShort", "").upper() == "US"
              and row.get("OpenVPN_ConfigData_Base64")
          ]

          # Чем выше Score — тем лучше.
          # При одинаковом Score предпочитаем меньший Ping.
          servers.sort(
              key=lambda row: (
                  -int(row.get("Score") or 0),
                  number(row.get("Ping"))
              )
          )

          # Берём 15 кандидатов.
          servers = servers[:15]

          if not servers:
              raise SystemExit(
                  "No US VPNGate servers found"
              )

          for index, row in enumerate(servers, start=1):

              hostname = row.get(
                  "HostName",
                  f"server-{index}"
              )

              safe = re.sub(
                  r"[^A-Za-z0-9_.-]+",
                  "_",
                  hostname
              )

              filename = (
                  f"candidate_{index:02d}_{safe}.ovpn"
              )

              encoded = row[
                  "OpenVPN_ConfigData_Base64"
              ]

              try:
                  config = base64.b64decode(
                      encoded
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )
              except Exception as e:
                  print(
                      f"Cannot decode {hostname}: {e}"
                  )
                  continue

              Path(
                  "candidates",
                  filename
              ).write_text(
                  config,
                  encoding="utf-8"
              )

              print(
                  f"{index}: "
                  f"{hostname} | "
                  f"{row.get('IP')} | "
                  f"Ping={row.get('Ping')} | "
                  f"Score={row.get('Score')}"
              )
          PY

          echo
          echo "Candidate configs:"
          ls -lh candidates/

      - name: Test OpenVPN configurations
        id: test
        run: |
          set +e

          mkdir -p working
          mkdir -p working/logs

          echo "Working VPN servers:" > working/working_servers.csv
          echo "config,host,ip,ping,score,external_ip" \
            >> working/working_servers.csv

          SUCCESS=0
          MAX_SUCCESS=5

          for CONFIG in candidates/*.ovpn; do

            if [ ! -f "$CONFIG" ]; then
              continue
            fi

            BASENAME=$(basename "$CONFIG")

            echo
            echo "=========================================="
            echo "Testing: $BASENAME"
            echo "=========================================="

            LOG="working/logs/${BASENAME}.log"

            # VPNGate обычно использует vpn/vpn.
            cat > working/auth.txt <<EOF
          vpn
          vpn
          EOF

            chmod 600 working/auth.txt

            sudo timeout 75 \
              openvpn \
              --config "$CONFIG" \
              --auth-user-pass working/auth.txt \
              --daemon \
              --writepid "/tmp/vpngate-${SUCCESS}.pid" \
              --log "$LOG"

            PIDFILE="/tmp/vpngate-${SUCCESS}.pid"

            CONNECTED=0

            for i in $(seq 1 60); do

              if grep -q \
                "Initialization Sequence Completed" \
                "$LOG" 2>/dev/null; then

                CONNECTED=1
                break
              fi

              if grep -qi \
                "AUTH_FAILED" \
                "$LOG" 2>/dev/null; then

                break
              fi

              sleep 1
            done

            if [ "$CONNECTED" -eq 1 ]; then

              echo "OPENVPN CONNECTION: SUCCESS"

              EXTERNAL_IP=$(
                curl \
                  --interface tun0 \
                  --max-time 10 \
                  -4 \
                  https://api.ipify.org \
                  2>/dev/null
              )

              if [ -n "$EXTERNAL_IP" ]; then

                echo "External IP: $EXTERNAL_IP"

                # Получаем имя/IP/метаданные из файла.
                python3 - "$CONFIG" "$EXTERNAL_IP" <<'PY'
          import sys
          import re

          config = sys.argv[1]
          external_ip = sys.argv[2]

          # Метаданные будут дополнены ниже.
          print(
              f"{config}|{external_ip}"
          )
          PY

                SUCCESS=$((SUCCESS + 1))

                cp "$CONFIG" \
                  "working/US_WORKING_${SUCCESS}.ovpn"

                echo "Working config saved."

              else

                echo "VPN connected, but external IP check failed."

              fi

            else

              echo "OPENVPN CONNECTION: FAILED"

            fi

            # Остановить OpenVPN.
            sudo pkill openvpn 2>/dev/null

            sleep 2

            if [ "$SUCCESS" -ge "$MAX_SUCCESS" ]; then
              echo
              echo "Found $MAX_SUCCESS working servers."
              break
            fi

          done

          echo
          echo "=========================================="
          echo "RESULT"
          echo "=========================================="

          echo "Working servers found: $SUCCESS"

          if [ "$SUCCESS" -eq 0 ]; then
            echo
            echo "No working VPNGate US servers found."
            echo
            echo "Logs:"
            find working/logs -type f -maxdepth 1 -print
            exit 1
          fi

      - name: Verify working configs
        run: |
          echo "Working OpenVPN configs:"
          ls -lh working/*.ovpn

          echo
          echo "Testing that configs contain OpenVPN directives:"

          for CONFIG in working/*.ovpn; do
            echo
            echo "===== $CONFIG ====="

            grep -E \
              "^(client|remote|proto|dev|auth|cipher|data-ciphers)" \
              "$CONFIG" \
              | head -20 || true
          done

      - name: Create CSV and ZIP
        run: |
          python3 <<'PY'
          import csv
          import re
          import zipfile
          from pathlib import Path

          output = Path("working")

          configs = sorted(
              output.glob("US_WORKING_*.ovpn")
          )

          if not configs:
              raise SystemExit(
                  "No working configs found"
              )

          csv_path = output / "vpngate_us_working.csv"

          with csv_path.open(
              "w",
              newline="",
              encoding="utf-8-sig"
          ) as f:

              writer = csv.writer(f)

              writer.writerow([
                  "config",
                  "vpn",
                  "username",
                  "password"
              ])

              for config in configs:

                  writer.writerow([
                      config.name,
                      "VPNGate",
                      "vpn",
                      "vpn"
                  ])

          readme = output / "README.txt"

          readme.write_text(
              """VPNGate working OpenVPN configurations

          These configurations were obtained from VPNGate
          and successfully established an OpenVPN tunnel
          during the GitHub Actions test.

          VPNGate credentials:

          Username: vpn
          Password: vpn

          Kali Linux:

          sudo apt install openvpn

          sudo openvpn --config US_WORKING_1.ovpn

          Check external IP:

          curl -4 https://api.ipify.org
          """,
              encoding="utf-8"
          )

          zip_path = Path(
              "vpngate_us_working.zip"
          )

          with zipfile.ZipFile(
              zip_path,
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as z:

              z.write(
                  csv_path,
                  csv_path.name
              )

              z.write(
                  readme,
                  readme.name
              )

              for config in configs:
                  z.write(
                      config,
                      config.name
                  )

          print(
              f"Created {zip_path}"
          )

      - name: Upload working VPN configs
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-us-working
          path: |
            vpngate_us_working.zip
            working/vpngate_us_working.csv
            working/README.txt
            working/US_WORKING_*.ovpn
          retention-days: 7
          if-no-files-found: error

      - name: Final result
        run: |
          echo
          echo "=========================================="
          echo "VPNGate test completed"
          echo "=========================================="
          echo
          echo "Download artifact:"
          echo "vpngate-us-working"
          echo
          ls -lh vpngate_us_working.zip

